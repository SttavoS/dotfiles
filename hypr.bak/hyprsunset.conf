# hyprsunset usa hyprlang (não migra para Lua)
# TODO: hyprsunset não está instalado; instale para usar nightlight

# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
profile {
    time = 07:00
    identity = true
}

# To enable auto switch to nightlight, add to autostart.lua:
# hl.exec_cmd("hyprsunset")
# and use the following:
# profile {
#     time = 20:00
#     temperature = 4000
# }
