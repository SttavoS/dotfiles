# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Omarchy defaults, vendored into this repo (formerly ~/.local/share/omarchy/default/hypr)
source = ~/.config/hypr/omarchy/autostart.conf
source = ~/.config/hypr/omarchy/bindings/media.conf
source = ~/.config/hypr/omarchy/bindings/clipboard.conf
source = ~/.config/hypr/omarchy/bindings/tiling-v2.conf
source = ~/.config/hypr/omarchy/bindings/utilities.conf
source = ~/.config/hypr/omarchy/envs.conf
source = ~/.config/hypr/omarchy/looknfeel.conf
source = ~/.config/hypr/omarchy/input.conf
source = ~/.config/hypr/omarchy/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# Workspaces 1-9 fixados no monitor externo
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1

# Workspace especial só pro notebook (pode usar como scratchpad)
workspace = 10, monitor:eDP-1, default:true

exec-once = ~/.config/hypr/scripts/monitor-switch.sh

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
