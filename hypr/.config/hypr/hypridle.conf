# hypridle usa hyprlang (não migra para Lua)
general {
    lock_cmd = pidof hyprlock || hyprlock                  # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session               # lock before suspend
    after_sleep_cmd = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    # delay for PAM readiness, then turn on display
    inhibit_sleep = 3                                      # wait until screen is locked
}

# TODO: screensaver opcional antes do lock (ex.: um TUI fullscreen após 2.5 min)
# listener {
#     timeout = 150
#     on-timeout = ...
# }

# Lock system after 5 minutes
listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
